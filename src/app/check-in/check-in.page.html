<app-header title="Lisa check-in"></app-header>

<ion-content [fullscreen]="true">
  <div class="page">

    <div class="form-card">
      <h2 class="form-card-title">
        <i class="fa-solid fa-location-dot"></i> Koht
      </h2>

      <ion-searchbar
        [value]="searchQuery"
        (ionInput)="onSearchChange($event.detail.value)"
        placeholder="Otsi baare ja klubisid">
      </ion-searchbar>

      @if (showResults && filteredPlaces.length > 0) {
        <ion-list class="place-results">
          @for (place of filteredPlaces; track place.id) {
            <ion-item button (click)="selectPlace(place)">
              <ion-label>{{ place.name }}</ion-label>
              <ion-note slot="end">{{ place.type }}</ion-note>
            </ion-item>
          }
        </ion-list>
      }

      <h2 class="form-card-title date-title">
        <i class="fa-regular fa-calendar-days"></i> Kuupäev
      </h2>

      <ion-item class="form-input">
        <ion-input
          type="date"
          [(ngModel)]="date"
          [max]="today"
          name="date">
        </ion-input>
      </ion-item>
    </div>

  </div>
</ion-content>
