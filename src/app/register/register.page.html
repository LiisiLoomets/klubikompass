<ion-content class="register-content">
  <div class="page">
    <div class="register-header">
      <h1 class="title">Loo <span class="highlight">konto</span></h1>
      <p>Alusta oma elamuste teekonda</p>
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label class="form-label">Kasutajanimi</label>
        <ion-item class="form-input">
          <ion-input
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="party_liisi"
          ></ion-input>
        </ion-item>
      </div>

      <div class="form-group">
        <label class="form-label">E-post</label>
        <ion-item class="form-input">
          <ion-input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="sinu@email.com"
          ></ion-input>
        </ion-item>
      </div>

      <div class="form-group">
        <label class="form-label">Parool</label>
        <ion-item class="form-input">
          <ion-input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
          ></ion-input>
        </ion-item>
      </div>

      <div class="form-group">
        <label class="form-label">Korda parool</label>
        <ion-item class="form-input">
          <ion-input
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••"
          ></ion-input>
        </ion-item>
      </div>

      @if (errorMessage){
        <ion-text color="danger">
          <p class="error">{{ errorMessage }}</p>
        </ion-text>
      }

      <ion-button class="form-button" expand="block" type="submit" [disabled]="loading">
        @if (loading) { Laadimine... } @else { Loo konto }
      </ion-button>
    </form>

    <p class="login-link">
      Juba konto?
      <a (click)="goToLogin()">Logi sisse</a>
    </p>
  </div>
</ion-content>
