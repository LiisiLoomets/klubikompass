<ion-app>
  <ion-menu side="end" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menüü</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item button routerLink="/settings" (click)="closeMenu()">
          <ion-label>Sätted</ion-label>
        </ion-item>
        <ion-item button routerLink="/disclaimer" (click)="closeMenu()">
          <ion-label>Disclaimer</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
