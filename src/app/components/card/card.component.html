<ion-card class="app-card">
  <ion-card-header>
    <ion-card-title [style.color]="titleColor">
      @if (icon) {
        <i [class]="icon"></i>
      }
      {{ title }}
    </ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ng-content></ng-content>
  </ion-card-content>
</ion-card>
