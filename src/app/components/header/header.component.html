<ion-header>
  <ion-toolbar>
    @if (showLogo) {
      <ion-buttons slot="start">
        <img src="assets/icon/logo.png" alt="Logo" class="toolbar-logo">
      </ion-buttons>
    } 
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
